name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run bandit -q -r src
      - run: uv run pytest
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sixhats:ci .
      - name: Runs as non-root, read-only, with no capabilities
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges sixhats:ci version
          test "$(docker run --rm --entrypoint id sixhats:ci -u)" = "10001"
  compose:
    # The web interface in containers (compose.yaml), using the built-in demo model: no key, no cost.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Starts healthy and serves a whole run through the web container
        run: |
          docker compose up -d --wait
          curl -sf http://127.0.0.1:3000/api/health
          curl -sfN -X POST http://127.0.0.1:3000/api/run -H 'content-type: application/json' \
            -d '{"question":"Should we adopt a four-day week?"}' | grep -q '^event: report'
      - name: The API is not published, and neither container runs as root
        run: |
          ! curl -s -m 3 http://127.0.0.1:8000/api/health
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T web id -u)" != "0"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
