name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run bandit -q -r src
      - run: uv run pytest
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sixhats:ci .
      - name: Runs as non-root, read-only, with no capabilities
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges sixhats:ci version
          test "$(docker run --rm --entrypoint id sixhats:ci -u)" = "10001"
