[project]
name = "six-hats"
version = "1.3.0"
description = "Edward de Bono's Six Thinking Hats as a LangGraph multi-agent application."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
dependencies = [
  "langchain>=1.4,<1.5",
  "langgraph>=1.2.14,<1.3",
  "langchain-anthropic>=1.0",
  "langchain-openai>=1.7.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "structlog>=24",
  "typer>=0.12",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
sixhats = "six_hats.interfaces.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-socket>=0.7",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
  "types-PyYAML",
  "httpx>=0.27",
  "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/six_hats"]

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF012"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --cov=six_hats --cov-report=term-missing --cov-fail-under=85"
markers = [
  "live: calls a real model; excluded from CI",
  "quality: behavioural checks on a real model (SIXHATS_QUALITY=1); excluded from CI",
]

[tool.bandit]
exclude_dirs = ["tests"]
